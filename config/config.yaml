timeframes:
  - 1d
  - 3d
  - 1w
  - 1M

exchanges:
  binance:
    enabled: true
    rate_limit: 1200
  bybit:
    enabled: true
    rate_limit: 120
  okx:
    enabled: true
    rate_limit: 20

database:
  type: sqlite
  path: data/screener.db

analysis:
  min_candles: 100
  support_resistance:
    min_touches: 2
    price_tolerance: 0.005
  head_shoulders:
    min_pattern_length: 20
    symmetry_tolerance: 0.1
  signals:
    min_confidence: 0.7
    test_risk_usd: 2.9     # риск на сделку под депозит 888$ и общий лимит 3% (paper-тест с 2026-10-11)

updates:
  interval_seconds: 60

# Чёрный список для сканов топ-альтов (pump scan + accumulation scan):
# мемы без фундаментала и токенизированные акции. На основной вотчлист не влияет.
scan_blacklist:
  - MARSCOIN   # мем
  - GENIUS     # мем
  - CRCLB      # токенизированная акция Circle
  - MSTRB      # токенизированная акция MicroStrategy

accumulation_scan:
  enabled: true               # Wyckoff-детектор накопления (или через --pump-scan флаг)
  scan_watchlist: true        # прогонять детектор и по монетам из assets, не только по внешним альтам
  timeframe: 1d               # дневной таймфрейм — накопление видно здесь
  top_n: 50                   # больше монет чем pump scan — накопление редкое
  limit: 100                  # 100 дневных свечей = ~3 месяца
  min_volume_usd: 5000000
  min_market_cap_usd: 50000000
  sideways_period: 20         # сколько свечей смотреть для боковика
  sideways_threshold: 0.18    # монета в боковике ±18% за 20 дней
  rsi_min: 25.0               # RSI ниже = паника, не накопление
  rsi_max: 62.0               # RSI выше = уже не накопление, уже рост
  min_score: 0.55

pump_scan:
  enabled: false            # true — включить в каждой итерации; или запускать через --pump-scan
  timeframe: 1h             # таймфрейм для pump-анализа (1h — быстрее ловит движение)
  top_n: 30                 # сколько топ-альтов сканировать
  limit: 120                # кол-во свечей (120h = 5 дней)
  min_volume_usd: 5000000   # минимальный суточный объём (фильтр ликвидности), $5M
  min_market_cap_usd: 50000000  # минимальная рыночная капитализация, $50M (данные CoinGecko)
  volume_multiplier: 2.0    # объём прорыва >= N×avg(20)
  rsi_min: 35.0             # hard-фильтр снизу (ниже = нисходящий тренд)
  rsi_max: 72.0             # hard-фильтр сверху (выше = уже поздно)
  squeeze_lookback: 30      # сколько свечей смотреть для BB squeeze

