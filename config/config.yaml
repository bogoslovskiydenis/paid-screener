assets:
  - ETH      # ETH/USDT спот
  - SOL      # SOL/USDT спот (то же самое, что пара SOL/USDT на Binance)
  - BTC      # BTC/USDT спот
  - BNB      # BNB/USDT спот — высокая ликвидность, бета к бирже
  - XLM      # XLM/USDT спот
  - "ETH/BTC"
  - "SOL/ETH"
  - "SOL/BTC"
  - "XLM/BTC"  # кросс XLM к BTC (спот)

timeframes:
  - 4h
  - 1d
  - 3d
  - 1w
  - 1M

exchanges:
  binance:
    enabled: true
    rate_limit: 1200
  bybit:
    enabled: true
    rate_limit: 120
  okx:
    enabled: true
    rate_limit: 20

database:
  type: sqlite
  path: data/screener.db

analysis:
  min_candles: 100
  support_resistance:
    min_touches: 2
    price_tolerance: 0.005
  head_shoulders:
    min_pattern_length: 20
    symmetry_tolerance: 0.1
  signals:
    min_confidence: 0.7
    test_risk_usd: 10.0

updates:
  interval_seconds: 60

